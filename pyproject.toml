[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryweave"
version = "0.1.0"
description = "Reusable Django ORM reporting toolkit for filters, aggregations, grouping, and exports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "QueryWeave Contributors", email = "maintainers@example.com" }
]
keywords = ["django", "orm", "reporting", "analytics", "exports"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "Django>=4.2",
]

[project.optional-dependencies]
cli = ["PyYAML>=6.0"]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.6.0",
  "black>=24.0",
  "mypy>=1.10",
  "django-stubs>=5.0",
  "types-PyYAML>=6.0.12",
]

[project.urls]
Homepage = "https://github.com/your-org/queryweave"
Documentation = "https://github.com/your-org/queryweave/tree/main/docs"
Repository = "https://github.com/your-org/queryweave"
Issues = "https://github.com/your-org/queryweave/issues"

[project.scripts]
queryweave = "queryweave.cli:main"

[tool.setuptools.packages.find]
include = ["queryweave*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
